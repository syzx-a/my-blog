# 输出格式
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]

# 分类法
[taxonomies]
  category = 'categories'
  tag = 'tags'
  series = 'series'

# Sitemap 配置
[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

# 时间格式
[frontmatter]
  date = [':filename', ':default']
  lastmod = [':git', 'lastmod', ':fileModTime', ':default']

# 内容类型
[mediaTypes]
  [mediaTypes."application/ld+json"]
    suffixes = ["json"]

# Markdown 配置
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    hl_inline = false
    lineAnchors = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    noHl = false
    style = "monokai"
    tabWidth = 4

[markup.tableOfContents]
  endLevel = 3
  ordered = false
  startLevel = 2

# Minify 配置
[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  disableJSON = false
  disableSVG = false
  disableXML = false
  minifyOutput = true