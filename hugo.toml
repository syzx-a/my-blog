baseURL = 'https://syzx.space'
languageCode = 'zh-CN'
title = '实用哲学'
theme = 'PaperMod'

# 网站基础信息
copyright = '© 2026 实用哲学'

# 语言配置
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false
hasCJKLanguage = true
summaryLength = 120
[pagination]
  pagerSize = 10

# SEO 相关
enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true
rssLimit = 50

[params]
  author = '实用哲学'
  description = '深入解读儒释道经典，分享哲学思考，传承千年智慧，启迪当代人生。探索《论语》《道德经》《金刚经》等经典的现代应用。'
  keywords = ['国学', '传统文化', '儒释道', '哲学', '智慧', '经典', '论语', '道德经', '金刚经', '修身养性']

  # 品牌层配置（2026-11-05 信息架构升级）
  # 注意：以下为扁平键，必须留在 [params] 的第一个子表之前
  brandKicker = '实用哲学 · 识微堂'
  brandTagline = '以经典为根，以日用为归'
  brandLead = '把《论语》《道德经》《金刚经》《鬼谷子》读回今天的日子里。这里不把经典供在神坛上，只讲它怎么落在静坐、说话、做事上。'
  authorRole = '传统文化研习者 · 内容创作者'
  authorMotto = '古为今用，知行合一'
  licenseName = 'CC BY 4.0'
  licenseUrl = 'https://creativecommons.org/licenses/by/4.0/deed.zh-hans'
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  comments = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  # SEO 增强
  env = 'production'
  DateFormat = '2006-01-02'

  # 统计分析配置（PaperMod 内置格式）
  [params.analytics]
    # Google Analytics（GA4）— 填入测量ID如 G-XXXXXXXXXX
    google = { id = 'G-JWTVPZT1XR' }
    # 百度统计 ID
    baidu = '3e73d41885f6d93dcfc2aa6eb4c77050'
  
  [params.assets]
    favicon = '/favicon.ico'
    favicon16x16 = '/favicon-16x16.png'
    favicon32x32 = '/favicon-32x32.png'
    apple_touch_icon = '/apple-touch-icon.png'
    
  [params.profileMode]
    enabled = false
    title = '实用哲学'
    subtitle = '传承千年智慧，启迪当代人生'
    imageUrl = '/images/logo.svg'
    imageWidth = 120
    imageHeight = 120
  
  # 首页介绍区（文章列表上方）
  [params.homeInfoParams]
    Title = '传承千年智慧，启迪当代人生 ☯️'
    Content = '深入解读儒释道经典，分享哲学思考。在这里，传统不是博物馆里的文物，而是可以指导当下生活的智慧。'
  
  # 首页显示设置
  ShowFullTextinRSS = false
  disableSpecial1stPost = false
  disableScrollToTop = false

  # name 供主题匹配图标，title 是给读者看的名称
  # TODO: 抖音 / B 站仍是占位地址，待补真实 ID 后替换
  [[params.socialIcons]]
    name = 'wechat'
    title = '公众号 · 实用哲学'
    url = 'https://mp.weixin.qq.com/mp/profile_ext?action=home&__biz=Mzk0NjQwNTU5Ng=='
  [[params.socialIcons]]
    name = 'douyin'
    title = '抖音'
    url = 'https://www.douyin.com/user/MS4wLjABAAAA'
  [[params.socialIcons]]
    name = 'bilibili'
    title = 'B 站'
    url = 'https://space.bilibili.com/'
  [[params.socialIcons]]
    name = 'email'
    title = '邮件联系'
    url = 'mailto:601522876@qq.com'

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

# 首页「从这里开始」：按读者意图分流，而不是按时间倒序
